id: lean-verification
purpose: Independently build Lean proof resources and audit their axioms.
trigger_states: [EXECUTION_TRACKS_THEORY_VERIFY_CORE_FORMAL]
inputs: [Frozen ScientificClaim revision, Lean source, Semantic mapping, Locked Lean toolchain]
outputs: [LEAN Review, AXIOM_AUDIT Review, Build and audit resources]
tools: [research_artifact_read, resource_read, lean, lake, axiom_audit, research_artifact_propose, research_action_submit]
procedure:
  - Perform a clean build using the locked Lean and mathlib versions.
  - Reject sorry, sorryAx, and custom axioms outside the project allowlist and record actual axioms.
  - Distinguish proof, library, formalization, and suspected mathematical failures.
completion_conditions: [Clean build passes, Axiom audit passes, Reviews include source and toolchain hashes]
failure_classes: [LEAN_PROOF_GAP, LIBRARY_GAP, FORMALIZATION_GAP, UNAPPROVED_AXIOM, SORRY_FOUND, MATHEMATICAL_FAILURE_SUSPECTED]
non_goals: [Weakening the theorem to compile, Treating a library gap as a false claim, Modifying target artifacts]
forbidden_behaviors: [Rewriting the theorem or mapping, Accepting sorry sorryAx or unapproved axioms, Classifying a library gap as mathematical failure without evidence]
permissions: {profile: formal-reviewer, sandbox: scratch-write, operations: [READ, QUERY, CREATE, RESOURCE_WRITE, RUN], artifact_kinds: [Review], field_policy: Create Reviews and immutable audit resources only, canonical_promote: false}
provenance: [project_id, run_id, action_id, dsh_session_id, bundle_sha256, input_git_commit, pinned_input_refs, lean_version, mathlib_commit, build_manifest, axiom_list, independent_session]
