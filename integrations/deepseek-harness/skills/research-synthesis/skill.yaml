id: research-synthesis
purpose: Merge theory, experiment, and literature into explicit Claim-Evidence relationships.
trigger_states: [SYNTHESIS_BUILD]
inputs: [Joined ScientificClaims, Completed Experiments, LiteratureEvidence, Track Reviews]
outputs: [Claim evidence revisions, Synthesis Review or Decision proposals]
tools: [research_artifact_read, research_artifact_query, research_artifact_resolve, research_artifact_validate, research_artifact_propose, research_action_submit]
procedure:
  - Link supporting contradicting and verifying evidence to each required Claim using pinned revisions.
  - Distinguish verified, partially supported, contradicted, and unknown conclusions.
  - Preserve limitations, negative results, and unresolved contradictions verbatim in the evidence graph.
  - Keep a repaired defect from an obsolete Claim revision visible as negative provenance but mark its synthesis issue RESOLVED after the current revision has independent PASS evidence; leave OPEN only issues that still affect a current Claim or active Plan criterion.
  - Treat a controller-authored VERIFIED revision r+1 as the lifecycle promotion of independently reviewed revision r only when verification.review_refs and a VERIFIES edge pin a same-Claim PASS Review at exactly r and the scientific statement, assumptions, dependencies, and proof-resource refs are unchanged. Count that as current-revision verified evidence and never emit REVISION_MISMATCH merely because the controller recorded verification by incrementing the Claim revision; arbitrary edits, skipped revisions, and stale Reviews remain mismatches.
completion_conditions: [Every required output has an explicit evidence status, All contradictions and limitations remain visible]
failure_classes: [EVIDENCE_GAP, REVISION_MISMATCH, UNRESOLVED_CONTRADICTION]
non_goals: [Inventing results, Resolving contradictions by narrative, Choosing completion verdict]
forbidden_behaviors: [Deleting or obscuring contradictory evidence, Inventing results or literature support, Promoting an unsupported Claim]
permissions: {profile: producer, sandbox: read-only, operations: [READ, QUERY, VALIDATE, CREATE, REVISE], artifact_kinds: [ScientificClaim, Review, Decision], field_policy: Claim evidence and status fields plus new Review or Decision, canonical_promote: false}
provenance: [project_id, run_id, action_id, dsh_session_id, bundle_sha256, input_git_commit, pinned_input_refs, evidence_resource_hashes]
