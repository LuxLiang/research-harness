id: scientific-writing
purpose: Produce a manuscript whose scientific statements are fully traceable to accepted artifacts.
trigger_states: [WRITING_DRAFT, WRITING_TARGETED_REVISION_EDITORIAL]
inputs: [Verified ScientificClaims, Completed Experiments, Verified LiteratureEvidence, Reviews, Existing manuscript]
outputs: [Manuscript resources, Figures and tables, paper/traceability.yaml, Anchor bindings]
tools: [research_artifact_read, research_artifact_resolve, resource_read, paper_filesystem, citation_validate, research_action_submit]
procedure:
  - 'Produce a self-contained submission-grade manuscript rather than an artifact synopsis: include the precise protocol and filtration, both algorithms as executable pseudocode, all theorem assumptions and correction terms, proof roadmaps in the main text, complete proofs in appendices, a theorem-level related-work comparison, limitations, and the preregistered future experiment protocol without fabricating results.'
  - Read every proof resource referenced by an included VERIFIED or IN_PAPER ScientificClaim completely with resource_read. Faithfully reconstruct its definitions, lemmas, and proof steps; do not replace a complete proof with a citation to an internal artifact or a one-paragraph assertion.
  - 'Present Base and Optimistic as the two proposed algorithms, and describe the chosen-arm construction only as a premise-matched analytical baseline. State the finite strict-separation witness exactly as finite and never inflate it into universal or asymptotic dominance.'
  - Prepare resources and write only claims, results, numbers, and novelty statements supported by pinned artifacts.
  - Bind every theorem, major empirical result, novelty statement, figure, and table to revision-pinned evidence.
  - Audit traceability and label unsupported material as discussion, hypothesis, or future work.
  - Write paper/traceability.yaml using the exact research-traceability/v0.1 contract with only traceability_version, project_id, manuscript_paths, and entries at top level; every entry has exactly anchor, statement_type, source_refs, and resource_refs. Put action and manuscript provenance in paper/provenance.yaml, never as extra traceability keys.
  - After the manuscript and schema-valid traceability are durable, call research_action_submit with proposal_ids_json set to [] and outcome SUBMITTED; a writer action has no artifact proposals and must not use FAILED merely because the proposal list is empty.
completion_conditions: [The manuscript is self-contained and submission-grade apart from explicitly unexecuted experiments, Every included theorem has a complete proof or exact appendix pointer, No major statement lacks a trace, All numbers come from pinned runs, Citation keys resolve to LiteratureEvidence]
failure_classes: [TRACEABILITY_GAP, MISSING_RESOURCE, CITATION_FAILURE, OVERCLAIM]
non_goals: [Creating ScientificClaims, Changing scientific conclusions, Inventing results]
forbidden_behaviors: [Creating or scientifically modifying a Claim, Writing untraced numbers figures or novelty statements, Presenting SUPPORTED or INCONCLUSIVE results as proved or positive]
permissions: {profile: writer, sandbox: paper-write, operations: [READ, QUERY, RESOURCE_WRITE], artifact_kinds: [], field_policy: Paper resources only and no scientific artifact mutation, canonical_promote: false}
provenance: [project_id, run_id, action_id, dsh_session_id, bundle_sha256, input_git_commit, pinned_input_refs, manuscript_commit, traceability_sha256]
