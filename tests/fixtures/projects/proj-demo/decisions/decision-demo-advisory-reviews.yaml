tags: [architecture, review-policy]
decision: Review artifacts provide recommendations but never mutate their target artifact directly.
context: Reviewer authority must remain separate from workflow control and human judgment.
reason: Separation keeps review evidence durable while allowing different workflows to apply different gates.
alternatives_considered:
  - option: Let reviewers directly change target status.
    rejected_because: It couples scientific assessment to orchestration authority.
