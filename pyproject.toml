[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-harness"
version = "0.1.1"
description = "Artifact-driven deterministic runtime for long-running scientific research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.20",
  "referencing>=0.30",
]

[project.optional-dependencies]
dev = ["build>=1.0", "pytest>=8"]

[project.scripts]
research-artifacts = "research_artifacts.cli:main"
research-artifacts-sidecar = "research_artifacts.sidecar:main"
research-evals = "research_evals.cli:main"
research = "research_artifacts.mvp_cli:main"

[tool.setuptools.packages.find]
include = ["research_artifacts*", "research_evals*"]
