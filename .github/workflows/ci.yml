name: Framework checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: git config --global user.name 'Research Harness CI'
      - run: git config --global user.email 'ci@example.invalid'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: research-evals --baseline evals/baselines/v0.1.json
      - run: python -m build
      - name: Test installed wheel outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/research" --workspace "$RUNNER_TEMP/data-workspace" workspace-init
          "$RUNNER_TEMP/wheel-env/bin/research" --workspace "$RUNNER_TEMP/data-workspace" init example
          "$RUNNER_TEMP/wheel-env/bin/research" --workspace "$RUNNER_TEMP/data-workspace" status example
          "$RUNNER_TEMP/wheel-env/bin/research-evals"
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - name: Install fixed Lean compiler for core regressions
        shell: bash
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/lean.tar.zst" \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
      - name: Run real Lean verification regressions
        env:
          RESEARCH_HARNESS_TEST_LEAN: ${{ runner.temp }}/lean-4.19.0-linux/bin/lean
        run: python -m unittest tests.test_lean_verification
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/deepseek-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ../..
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/deepseek-harness/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
