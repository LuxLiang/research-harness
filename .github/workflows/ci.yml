name: Framework checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: git config --global user.name 'Research Harness CI'
      - run: git config --global user.email 'ci@example.invalid'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: research-evals
      - run: python -m build
      - name: Test installed wheel outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/research" --workspace "$RUNNER_TEMP/data-workspace" workspace-init
          "$RUNNER_TEMP/wheel-env/bin/research" --workspace "$RUNNER_TEMP/data-workspace" init example
          "$RUNNER_TEMP/wheel-env/bin/research" --workspace "$RUNNER_TEMP/data-workspace" status example
          "$RUNNER_TEMP/wheel-env/bin/research-evals"
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/deepseek-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/deepseek-harness/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
